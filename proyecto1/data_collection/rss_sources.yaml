# Fuentes RSS verificadas manualmente (curl, HTTP 200 + XML válido) el 2026-08-09.
# Todas son feeds públicos de titulares + resumen corto (no el artículo completo),
# publicados por el propio medio para sindicación 
# outlet: nombre del medio (queda en la columna "source" del dataset)
# url: endpoint RSS
# region: variante lingüística aproximada, para el sesgo de variante (ver dataset.md)
sources:
  - outlet: marca
    url: "https://www.marca.com/rss/futbol.xml"
    region: es
  - outlet: marca_laliga
    url: "https://e00-marca.uecdn.es/rss/futbol/primera-division.xml"
    region: es
  - outlet: marca_segunda
    url: "https://e00-marca.uecdn.es/rss/futbol/segunda-division.xml"
    region: es
  - outlet: marca_champions
    url: "https://www.marca.com/rss/futbol/champions-league.xml"
    region: es
  - outlet: marca_premier
    url: "https://www.marca.com/rss/futbol/premier-league.xml"
    region: es
  - outlet: marca_bundesliga
    url: "https://www.marca.com/rss/futbol/bundesliga.xml"
    region: es

# Feeds probados y descartados el 2026-08-09 (motivo entre paréntesis):
# - mundodeportivo.com/rss/* (no responde), as.com/futbol/rss.xml (404)
# - as.com/rss/tags/ultimas_noticias.xml (200 + XML válido pero <channel>
#   vacío, lastBuildDate de marzo 2024: feed abandonado, no roto)
# - sport.es/es/rss/portada/rss.xml (mismo caso: canal sin <item>)
# - espn.com/espn/rss/soccer/news (200 pero contenido en inglés, no ES;
#   espn.com.co/* daba 503 al probarlo)
# - marca.com/rss/tags/lesion.xml, /tags/sancion.xml, /segunda-division.xml
#   (404 — la ruta correcta de Segunda es la de e00-marca.uecdn.es de arriba)
