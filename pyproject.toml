[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]
extend-exclude = ["proyecto1/data"]

[tool.ruff.lint]
# Small, low-friction rule set on purpose: real bugs (F), style (E/W),
# import order (I) and modern-syntax hints (UP). No opinionated/heavy rules.
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E501", # line length is handled by ruff format, not worth failing CI over
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"] # notebooks legitimately import after markdown/setup cells
